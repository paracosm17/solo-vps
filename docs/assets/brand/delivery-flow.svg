<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="194" viewBox="0 0 1000 194" role="img" aria-labelledby="title desc">
  <title id="title">From Git push to a running application</title>
  <desc id="desc">Push code to GitHub. Actions runs tests and builds the container. GHCR stores the image. Coolify deploys it on your VPS.</desc>
