  <g fill="#161b22" stroke="#30363d">
    <rect x="24" y="24" width="202" height="146" rx="12"/>
    <rect x="274" y="24" width="202" height="146" rx="12"/>
    <rect x="524" y="24" width="202" height="146" rx="12"/>
    <rect x="774" y="24" width="202" height="146" rx="12"/>
  </g>
  <g fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m113 48 8 7-8 7m14 0h10"/>
    <path d="m364 55 8 8 15-18"/>
    <path d="m613 48 12-6 12 6v15l-12 6-12-6V48l12 6 12-6m-12 6v15"/>
    <rect x="861" y="43" width="28" height="11" rx="3"/>
    <rect x="861" y="60" width="28" height="11" rx="3"/>
    <path d="M868 48h1m-1 17h1"/>
  </g>
  <g fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M236 97h26m-7-6 7 6-7 6M486 97h26m-7-6 7 6-7 6M736 97h26m-7-6 7 6-7 6"/>
  </g>
  <g fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle">
    <text x="125" y="109">git push</text>
    <text x="375" y="109">Actions</text>
    <text x="625" y="109">GHCR</text>
    <text x="875" y="109">Coolify</text>
  </g>
  <g fill="#b1bac4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="125" y="140">Your application</text>
    <text x="375" y="140">Test &amp; build</text>
    <text x="625" y="140">Store the image</text>
    <text x="875" y="140">Deploy to your VPS</text>
