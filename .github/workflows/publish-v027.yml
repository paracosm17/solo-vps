name: Publish Solo VPS v0.2.7 (one-time)

# Separate from read-only fast-source; one specifically approved release.
on:
  workflow_run:
    workflows:
      - Repository CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: solo-vps-release-v0.2.7
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact successful main CI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Require reviewed release files and exact upstream identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${REVIEWED_HEAD}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')" = "${REVIEWED_HEAD}"
          test "$(git hash-object config/coolify-release.yml)" = "8ebf3ec70a94f7efc0509f42e4e42f71a23d68a0"
          test "$(git hash-object reviews/2026-11-10-coolify-473-production.md)" = "581d8863d46f31b36b011be12cdfb3f83f8c2c5b"
          test "$(git hash-object CHANGELOG.md)" = "8c246d72374b9c5b3bda48e31c6e6eece481a01b"
          test "$(git hash-object releases/v0.2.7.md)" = "0f9ef469cbfdf2233a4ec992492c66023e5eed0d"
          test -z "$(git status --porcelain)"
          grep -Fqx '## [0.2.7] - 2026-11-10' CHANGELOG.md

      - name: Install validated release QA prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client python3-venv python3-yaml nodejs
          export SOLO_VPS_DATA_BASE="${RUNNER_TEMP}/solo-vps-release-data"
          make qa-tools

      - name: Run exact v0.2.7 dry-run and QA before creating a tag
        shell: bash
        run: |
          set -euo pipefail
          export SOLO_VPS_DATA_BASE="${RUNNER_TEMP}/solo-vps-release-data"
          if git show-ref --verify --quiet refs/tags/v0.2.7; then
            test "$(git rev-list -n 1 v0.2.7)" = "$(git rev-parse HEAD)"
            echo 'Exact release tag already exists; resuming publication.'
          else
            make release-dry-run RELEASE_VERSION=v0.2.7
          fi

      - name: Independent full-history secret scan
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          "${HOME}/go/bin/gitleaks" git . --redact --no-banner --exit-code 1 --log-opts="--all"

      - name: Create exact annotated tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${REVIEWED_HEAD}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')" = "${REVIEWED_HEAD}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/tags/v0.2.7; then
            test "$(git rev-list -n 1 v0.2.7)" = "${REVIEWED_HEAD}"
          else
            git tag -a v0.2.7 -m 'Solo VPS v0.2.7'
            git push origin refs/tags/v0.2.7
          fi
          if gh release view v0.2.7 >/dev/null 2>&1; then
            echo 'Release already published; verified tag is retained.'
          else
            gh release create v0.2.7 --verify-tag \
              --title 'Solo VPS v0.2.7 — Coolify 4.7.3' \
              --notes-file releases/v0.2.7.md \
              --latest
          fi
          gh release view v0.2.7 --json url,isDraft,isPrerelease,tagName \
            --jq '{url, isDraft, isPrerelease, tagName}'
