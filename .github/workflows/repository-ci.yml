name: Repository CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-source:
    name: fast-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOLO_VPS_DATA_BASE: ${{ runner.temp }}/solo-vps-ci-data
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the exact workflow revision without third-party actions
        shell: bash
        env:
          SOLO_VPS_CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "${SOLO_VPS_CHECKOUT_TOKEN}" | base64 -w0)"
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}" \
            git -c protocol.version=2 fetch --no-tags --prune --depth=1 origin "${GITHUB_REF}"
          unset auth_header SOLO_VPS_CHECKOUT_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install minimal controller prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            openssh-client \
            python3-venv \
            python3-yaml

      - name: Run the bounded repository fast gate
        shell: bash
        run: |
          set -euo pipefail
          make ci-fast
