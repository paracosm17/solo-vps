---
- name: Run target preflight before disposable candidate forward resume
  ansible.builtin.import_playbook: preflight.yml

- name: Resume only the exact interrupted 4.1.2 to 4.3.21 evaluation
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - coolify-4.3.21-evaluation-vars.yml
  tasks:
    - name: Require explicit disposable-target confirmation
      ansible.builtin.assert:
        that:
          - solo_vps_coolify_evaluation_candidate | bool
          - solo_vps_coolify_evaluation_target_id | default('') is match('^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$')
          - solo_vps_coolify_evaluation_confirm | default('') == 'I_HAVE_VERIFIED_A_DISPOSABLE_COOLIFY_4_3_21_TARGET'
        fail_msg: "Candidate resume is allowed only on the explicitly identified disposable target."

    - name: Recreate candidate-only Coolify data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "9999"
        group: "0"
        mode: "0700"
      loop: "{{ solo_vps_coolify_evaluation_required_directories }}"

    - name: Resume the forward-only candidate upgrade
      ansible.builtin.import_role:
        name: coolify
        tasks_from: upgrade-resume

    - name: Verify the exact candidate Sentinel runtime
      ansible.builtin.import_role:
        name: coolify
        tasks_from: evaluate-sentinel
      vars:
        solo_vps_coolify_sentinel_expect_candidate: true
