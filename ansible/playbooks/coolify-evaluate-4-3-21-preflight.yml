---
- name: Run target preflight before disposable Coolify candidate inspection
  ansible.builtin.import_playbook: preflight.yml

- name: Inspect the disposable 4.1.2 to 4.3.21 evaluation path without mutation
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - coolify-4.3.21-evaluation-vars.yml
  tasks:
    - name: Verify evaluation-only Sentinel prerequisites
      ansible.builtin.import_role:
        name: coolify
        tasks_from: evaluation-preflight

    - name: Run the exact candidate lifecycle preflight
      ansible.builtin.import_role:
        name: coolify
        tasks_from: upgrade-preflight
