---
- name: Validate CI deploy transport configuration for verification
  ansible.builtin.import_tasks: assert-config.yml

- name: Load the expected CI deployment public key for verification
  ansible.builtin.import_tasks: load-public-key.yml

- name: Read the CI deployment passwd entry
  ansible.builtin.getent:
    database: passwd
    key: "{{ solo_vps_ci_deploy_user }}"
    fail_key: false

- name: Confirm the dedicated CI deployment account exists
  ansible.builtin.assert:
    that:
      - solo_vps_ci_deploy_user in (ansible_facts.get('getent_passwd', {}))
    fail_msg: "Dedicated CI deployment account '{{ solo_vps_ci_deploy_user }}' does not exist."

- name: Record the CI deployment account home
  ansible.builtin.set_fact:
    solo_vps_ci_deploy_home: "{{ ansible_facts.getent_passwd[solo_vps_ci_deploy_user][4] }}"

- name: Inspect CI deployment SSH files
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ solo_vps_ci_deploy_home }}"
    - "{{ solo_vps_ci_deploy_home }}/.ssh"
    - "{{ solo_vps_ci_deploy_home }}/.ssh/authorized_keys"
    - "{{ solo_vps_ci_deploy_sshd_dropin }}"
  register: solo_vps_ci_deploy_file_states

- name: Read the CI deployment authorized key
  ansible.builtin.slurp:
    src: "{{ solo_vps_ci_deploy_home }}/.ssh/authorized_keys"
  register: solo_vps_ci_deploy_authorized_keys_file

- name: Read the CI deployment sshd drop-in
  ansible.builtin.slurp:
    src: "{{ solo_vps_ci_deploy_sshd_dropin }}"
  register: solo_vps_ci_deploy_sshd_file

- name: Validate current OpenSSH daemon syntax
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
  changed_when: false

- name: Read effective OpenSSH policy for the CI deployment identity
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -T
      - -C
      - "user={{ solo_vps_ci_deploy_user }},host=localhost,addr=127.0.0.1"
  changed_when: false
  register: solo_vps_ci_deploy_sshd_effective

- name: Read CI deployment supplementary groups
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - -nG
      - "{{ solo_vps_ci_deploy_user }}"
  changed_when: false
  register: solo_vps_ci_deploy_groups

- name: Derive expected CI deployment SSH material
  ansible.builtin.set_fact:
    solo_vps_ci_deploy_expected_key_line: >-
      restrict,port-forwarding,permitopen="{{ solo_vps_ci_deploy_remote_host }}:{{ solo_vps_ci_deploy_remote_port }}" {{ solo_vps_ci_deploy_public_key }}
    solo_vps_ci_deploy_effective_lines: "{{ solo_vps_ci_deploy_sshd_effective.stdout_lines | default([]) }}"

- name: Verify the forwarding-only CI deployment account and sshd policy
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd[solo_vps_ci_deploy_user][5] == solo_vps_ci_deploy_shell
      - solo_vps_ci_deploy_file_states.results[0].stat.isdir | default(false)
      - solo_vps_ci_deploy_file_states.results[0].stat.pw_name | default('') == solo_vps_ci_deploy_user
      - solo_vps_ci_deploy_file_states.results[0].stat.mode | default('') == '0700'
      - solo_vps_ci_deploy_file_states.results[1].stat.isdir | default(false)
      - solo_vps_ci_deploy_file_states.results[1].stat.pw_name | default('') == solo_vps_ci_deploy_user
      - solo_vps_ci_deploy_file_states.results[1].stat.mode | default('') == '0700'
      - solo_vps_ci_deploy_file_states.results[2].stat.isreg | default(false)
      - solo_vps_ci_deploy_file_states.results[2].stat.pw_name | default('') == solo_vps_ci_deploy_user
      - solo_vps_ci_deploy_file_states.results[2].stat.mode | default('') == '0600'
      - (solo_vps_ci_deploy_authorized_keys_file.content | b64decode | trim) == solo_vps_ci_deploy_expected_key_line
      - solo_vps_ci_deploy_file_states.results[3].stat.isreg | default(false)
      - solo_vps_ci_deploy_file_states.results[3].stat.pw_name | default('') == 'root'
      - solo_vps_ci_deploy_file_states.results[3].stat.gr_name | default('') == 'root'
      - solo_vps_ci_deploy_file_states.results[3].stat.mode | default('') == '0644'
      - "'allowtcpforwarding local' in solo_vps_ci_deploy_effective_lines"
      - "'allowstreamlocalforwarding no' in solo_vps_ci_deploy_effective_lines"
      - "'permitopen 127.0.0.1:8000' in solo_vps_ci_deploy_effective_lines"
      - "'permitlisten none' in solo_vps_ci_deploy_effective_lines"
      - "'maxsessions 0' in solo_vps_ci_deploy_effective_lines"
      - "'passwordauthentication no' in solo_vps_ci_deploy_effective_lines"
      - "'authenticationmethods publickey' in solo_vps_ci_deploy_effective_lines"
      - "'kbdinteractiveauthentication no' in solo_vps_ci_deploy_effective_lines"
      - "'allowagentforwarding no' in solo_vps_ci_deploy_effective_lines"
      - "'permittty no' in solo_vps_ci_deploy_effective_lines"
      - "'permittunnel no' in solo_vps_ci_deploy_effective_lines"
      - "'permituserrc no' in solo_vps_ci_deploy_effective_lines"
      - "'x11forwarding no' in solo_vps_ci_deploy_effective_lines"
      - solo_vps_ci_deploy_groups.stdout.split() | length == 1
      - solo_vps_ci_deploy_groups.stdout.split()[0] == solo_vps_ci_deploy_user
    fail_msg: >-
      CI deployment SSH transport verification failed. Do not use this identity
      from GitHub Actions until the forwarding-only Match policy is exact.
    success_msg: >-
      CI deployment identity is key-only, sessionless, and restricted to local
      TCP forwarding toward 127.0.0.1:8000 only.
