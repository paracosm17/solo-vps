---
- name: Select guarded platform capacity policy
  ansible.builtin.import_tasks: capacity-policy.yml

- name: Read free space before installing the platform
  ansible.builtin.command:
    argv: ["{{ solo_vps_coolify_df_binary }}", --block-size=1, --output=avail, /]
  changed_when: false
  register: solo_vps_coolify_capacity_disk

- name: Check the minimum platform capacity before host mutation
  ansible.builtin.assert:
    that:
      - ansible_facts.get('processor_vcpus', 0) | int >= solo_vps_coolify_required_cpu_count | int
      - ansible_facts.get('memtotal_mb', 0) | int >= solo_vps_coolify_minimum_memory_mb
      - solo_vps_coolify_capacity_disk.stdout_lines[-1] | trim | int >= solo_vps_coolify_required_free_disk_bytes | int
    fail_msg: >-
      This VPS does not meet the selected capacity profile: at least
      {{ solo_vps_coolify_required_cpu_count }} vCPU, 2 GiB nominal RAM and
      {{ (solo_vps_coolify_required_free_disk_bytes | int / 1073741824) | int }} GiB
      free on /. The supported baseline is 2 vCPU and 30 GiB free; the optional
      evaluation.allow_small_vps profile is experimental only. No host baseline
      changes have been made by this check.
