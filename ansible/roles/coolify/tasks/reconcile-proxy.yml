---
# Coolify 4.4 uses explicit Compose files; persist policy through native actions.
- name: Require the host-owned ingress guard before native proxy lifecycle changes
  ansible.builtin.import_role:
    name: firewall
    tasks_from: verify-proxy-ingress-guard

- name: Wait for Coolify readiness before reconciling its native proxy configuration
  ansible.builtin.command:
    argv: ["{{ solo_vps_coolify_docker_binary }}", inspect, --format, "{{ '{{.State.Health.Status}}' }}", coolify]
  changed_when: false
  register: solo_vps_proxy_platform_health
  retries: 36
  delay: 5
  until: solo_vps_proxy_platform_health.stdout | trim == 'healthy'

- name: Reconcile only proxy ports through native Coolify configuration and lifecycle
  ansible.builtin.script:
    cmd: >-
      {{ (role_path ~ '/../../../scripts/coolify_proxy_policy.py') | quote }}
      --docker {{ solo_vps_coolify_docker_binary | quote }}
      --admin-user {{ admin.user | quote }} --apply
    executable: /usr/bin/python3
  register: solo_vps_proxy_policy_result
  changed_when: (solo_vps_proxy_policy_result.stdout | from_json).changed
