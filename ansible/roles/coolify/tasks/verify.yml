---
- name: Validate Coolify integration contract inputs
  ansible.builtin.import_tasks: assert-config.yml

- name: Inspect the Solo VPS Coolify ownership marker
  ansible.builtin.stat:
    path: "{{ solo_vps_coolify_managed_marker }}"
  register: solo_vps_coolify_marker_state

- name: Require an installation created by this exact Solo VPS backend
  ansible.builtin.assert:
    that:
      - solo_vps_coolify_marker_state.stat.exists
      - solo_vps_coolify_marker_state.stat.isreg
    fail_msg: >-
      No Solo VPS Coolify ownership marker exists. Verification intentionally
      refuses to adopt an unknown or partially failed /data/coolify installation.

- name: Read the Solo VPS Coolify ownership marker
  ansible.builtin.slurp:
    src: "{{ solo_vps_coolify_managed_marker }}"
  register: solo_vps_coolify_marker_raw

- name: Validate the managed installation identity
  ansible.builtin.assert:
    that:
      - "'managed_by=solo-vps' in (solo_vps_coolify_marker_raw.content | b64decode)"
      - "('coolify_version=' ~ solo_vps_coolify_version) in (solo_vps_coolify_marker_raw.content | b64decode)"
      - "('localhost_user=' ~ admin.user) in (solo_vps_coolify_marker_raw.content | b64decode)"
    fail_msg: >-
      The managed marker does not match this project pin/admin identity. Use the
      future explicit upgrade/reconciliation path; do not silently adopt drift.

- name: Look up the configured administrator for Coolify access verification
  ansible.builtin.getent:
    database: passwd
    key: "{{ admin.user }}"

- name: Derive the administrator identity for Coolify access verification
  ansible.builtin.set_fact:
    solo_vps_coolify_verify_admin_uid: "{{ ansible_facts.getent_passwd[admin.user][1] | int }}"
    solo_vps_coolify_verify_admin_gid: "{{ ansible_facts.getent_passwd[admin.user][2] | int }}"

- name: Inspect the host-owned Coolify data parent
  ansible.builtin.stat:
    path: "{{ solo_vps_coolify_data_parent }}"
  register: solo_vps_coolify_data_parent_state

- name: Verify the /data non-root traversal boundary
  ansible.builtin.assert:
    that:
      - solo_vps_coolify_data_parent_state.stat.exists
      - solo_vps_coolify_data_parent_state.stat.isdir
      - solo_vps_coolify_data_parent_state.stat.uid == 0
      - solo_vps_coolify_data_parent_state.stat.gid == 0
      - solo_vps_coolify_data_parent_state.stat.mode == solo_vps_coolify_non_root_parent_mode
    fail_msg: >-
      Coolify non-root ancestor access drifted at {{ solo_vps_coolify_data_parent }}.
      The generic host-owned data parent must remain root:root with execute-only
      traversal for non-root identities; the child /data/coolify boundary narrows
      traversal to admin.user. Run `make coolify` to reconcile managed
      integration state; `make verify-coolify` is read-only.

- name: Inspect the Coolify data-root traversal boundary
  ansible.builtin.stat:
    path: "{{ solo_vps_coolify_data_root }}"
  register: solo_vps_coolify_data_root_state

- name: Verify the Coolify data-root non-root traversal boundary
  ansible.builtin.assert:
    that:
      - solo_vps_coolify_data_root_state.stat.exists
      - solo_vps_coolify_data_root_state.stat.isdir
      - solo_vps_coolify_data_root_state.stat.uid == 9999
      - solo_vps_coolify_data_root_state.stat.gid == solo_vps_coolify_verify_admin_gid
      - solo_vps_coolify_data_root_state.stat.mode == solo_vps_coolify_non_root_data_root_mode
    fail_msg: >-
      Coolify non-root traversal access drifted at {{ solo_vps_coolify_data_root }}.
      The data root must keep UID 9999 ownership plus traverse-only access for
      admin.user's primary group. Run `make coolify` to reconcile managed
      integration state; `make verify-coolify` is read-only.

- name: Inspect Coolify non-root resource namespace roots
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ solo_vps_coolify_non_root_resource_roots }}"
  register: solo_vps_coolify_resource_root_states

- name: Verify Coolify resource namespace traversal boundaries
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - item.stat.uid == 9999
      - item.stat.gid == solo_vps_coolify_verify_admin_gid
      - item.stat.mode == solo_vps_coolify_non_root_resource_root_mode
    fail_msg: >-
      Coolify non-root resource namespace access drifted at {{ item.item }}.
      Namespace parents must stay UID 9999-owned with execute-only traversal for
      admin.user's primary group so upstream-created admin-owned child workdirs
      remain reachable without listing or write access to the parent. Run
      `make coolify` to reconcile; `make verify-coolify` is read-only.
  loop: "{{ solo_vps_coolify_resource_root_states.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Prove admin.user can traverse Coolify resource namespace roots
  ansible.builtin.command:
    argv:
      - /usr/bin/pwd
  args:
    chdir: "{{ item }}"
  become: true
  become_user: "{{ admin.user }}"
  changed_when: false
  loop: "{{ solo_vps_coolify_non_root_resource_roots }}"
  register: solo_vps_coolify_resource_root_chdir_probes

- name: Verify real non-root resource namespace traversal
  ansible.builtin.assert:
    that:
      - item.stdout | trim == item.item
    fail_msg: >-
      admin.user cannot enter {{ item.item }} even though metadata checks passed.
      Inspect its ancestor chain with `namei -l {{ item.item }}` before retrying
      Coolify resource lifecycle operations.
  loop: "{{ solo_vps_coolify_resource_root_chdir_probes.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect the private Coolify backup root
  ansible.builtin.stat:
    path: "{{ solo_vps_coolify_data_root }}/backups"
  register: solo_vps_coolify_backup_root_state

- name: Verify the Coolify backup root supports private non-root backup jobs
  ansible.builtin.assert:
    that:
      - solo_vps_coolify_backup_root_state.stat.exists
      - solo_vps_coolify_backup_root_state.stat.isdir
      - solo_vps_coolify_backup_root_state.stat.uid == 9999
      - solo_vps_coolify_backup_root_state.stat.gid == solo_vps_coolify_verify_admin_gid
      - solo_vps_coolify_backup_root_state.stat.mode == solo_vps_coolify_non_root_backup_root_mode
    fail_msg: >-
      Coolify backup-root access drifted. Pinned Coolify writes database backup
      files through the configured non-root SSH identity, so /data/coolify/backups
      must remain UID 9999-owned, private from unrelated users, and write+traverse
      accessible to admin.user's primary group. Run `make coolify` to reconcile;
      `make verify-coolify` is read-only.

- name: Prove admin.user can write and traverse but cannot list the Coolify backup root
  ansible.builtin.command:
    argv:
      - /usr/bin/test
      - "{{ item.flag }}"
      - "{{ solo_vps_coolify_data_root }}/backups"
  become: true
  become_user: "{{ admin.user }}"
  changed_when: false
  failed_when: false
  loop:
    - flag: -w
      expected_rc: 0
    - flag: -x
      expected_rc: 0
    - flag: -r
      expected_rc: 1
  register: solo_vps_coolify_backup_root_access_probes

- name: Verify the real non-root backup-root access boundary
  ansible.builtin.assert:
    that:
      - item.rc == item.item.expected_rc
    fail_msg: >-
      admin.user does not have the expected private backup-root access at
      /data/coolify/backups. Run `make coolify` to reconcile the managed boundary
      before retrying a Coolify database backup.
  loop: "{{ solo_vps_coolify_backup_root_access_probes.results }}"
  loop_control:
    label: "{{ item.item.flag }}"

- name: Inspect the Coolify proxy working directory
  ansible.builtin.stat:
    path: "{{ solo_vps_coolify_data_root }}/proxy"
  register: solo_vps_coolify_proxy_state

- name: Verify the Coolify proxy directory matches upstream non-root ownership
  ansible.builtin.assert:
    that:
      - solo_vps_coolify_proxy_state.stat.exists
      - solo_vps_coolify_proxy_state.stat.isdir
      - solo_vps_coolify_proxy_state.stat.uid == solo_vps_coolify_verify_admin_uid
      - solo_vps_coolify_proxy_state.stat.gid == solo_vps_coolify_verify_admin_gid
      - solo_vps_coolify_proxy_state.stat.mode == solo_vps_coolify_non_root_proxy_mode
    fail_msg: >-
      Coolify proxy working-directory access drifted. Pinned Coolify v4.1.2
      deliberately chowns /data/coolify paths created by its non-root `mkdir -p`
      control path to the configured server user, so the proxy directory must be
      owned by admin.user instead of being forced back to UID 9999. Run `make coolify`
      to reconcile; `make verify-coolify` is read-only.

- name: Prove admin.user can enter the Coolify proxy working directory
  ansible.builtin.command:
    argv:
      - /usr/bin/pwd
  args:
    chdir: "{{ solo_vps_coolify_data_root }}/proxy"
  become: true
  become_user: "{{ admin.user }}"
  changed_when: false
  register: solo_vps_coolify_proxy_chdir_probe

- name: Verify the real non-root proxy chdir path
  ansible.builtin.assert:
    that:
      - solo_vps_coolify_proxy_chdir_probe.stdout | trim == solo_vps_coolify_data_root ~ '/proxy'
    fail_msg: >-
      admin.user still cannot enter the Coolify proxy directory even though metadata
      checks passed. Inspect every ancestor with `namei -l /data/coolify/proxy` before
      retrying proxy startup.

- name: Verify pinned Coolify source artifacts still match committed checksums
  ansible.builtin.stat:
    path: "{{ solo_vps_coolify_source_dir }}/{{ item.name }}"
    checksum_algorithm: sha256
  loop: "{{ solo_vps_coolify_release_artifacts }}"
  loop_control:
    label: "{{ item.name }}"
  register: solo_vps_coolify_artifact_states

- name: Assert pinned Coolify source artifact integrity
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - "('sha256:' ~ item.stat.checksum) == item.item.checksum"
    fail_msg: "Pinned Coolify source artifact drifted: {{ item.item.name }}"
  loop: "{{ solo_vps_coolify_artifact_states.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Inspect the protected Coolify environment file
  ansible.builtin.stat:
    path: "{{ solo_vps_coolify_env_path }}"
  register: solo_vps_coolify_env_state

- name: Require a private target-side Coolify environment file
  ansible.builtin.assert:
    that:
      - solo_vps_coolify_env_state.stat.exists
      - solo_vps_coolify_env_state.stat.isreg
      - solo_vps_coolify_env_state.stat.mode == '0600'
    fail_msg: >-
      Coolify .env is missing or has unsafe permissions. Secret values are not
      read or printed by this verifier.

- name: Verify the running Coolify runtime and exposure contract
  ansible.builtin.import_tasks: verify-runtime.yml

- name: Report read-only Coolify verification summary
  ansible.builtin.debug:
    msg:
      status: PASS
      release: "{{ solo_vps_coolify_version }}"
      image: "{{ solo_vps_coolify_expected_image }}"
      localhost_user: "{{ admin.user }}"
      management_bind_address: "{{ solo_vps_coolify_management_bind_address }}"
      management_ports: "{{ solo_vps_coolify_management_ports }}"
      external_controller_probe: not-reachable
      docker_daemon_owner: ansible-m7
