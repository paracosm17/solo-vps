---
solo_vps_admin_shell: /bin/bash
solo_vps_admin_sudo_group: sudo
solo_vps_admin_sudoers_path: "/etc/sudoers.d/90-solo-vps-{{ admin.user }}"
solo_vps_ssh_public_key_regex: >-
  ^(?:ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521|sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-nistp256@openssh\.com)[ \t]+[A-Za-z0-9+/=]+(?:[ \t]+.*)?$
