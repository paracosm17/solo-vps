---
- name: Load the configured admin public key from the Ansible controller
  ansible.builtin.set_fact:
    solo_vps_admin_authorized_key: >-
      {{ lookup('ansible.builtin.file', admin.ssh_public_key_file | expanduser, errors='strict') | trim }}

- name: Confirm the controller file contains exactly one supported public key
  ansible.builtin.assert:
    that:
      - solo_vps_admin_authorized_key | length > 0
      - "'\n' not in solo_vps_admin_authorized_key"
      - "'PRIVATE KEY' not in solo_vps_admin_authorized_key"
      - solo_vps_admin_authorized_key is match(solo_vps_ssh_public_key_regex)
    fail_msg: >-
      admin.ssh_public_key_file must point to exactly one supported OpenSSH
      public key on the Ansible controller. Never provide a private key here.

- name: Load the configured human workstation public key
  ansible.builtin.set_fact:
    solo_vps_human_admin_authorized_key: "{{ admin.human_ssh_public_key | trim }}"

- name: Confirm the human workstation key is one supported public key
  ansible.builtin.assert:
    that:
      - solo_vps_human_admin_authorized_key | length > 0
      - "'\n' not in solo_vps_human_admin_authorized_key"
      - "'PRIVATE KEY' not in solo_vps_human_admin_authorized_key"
      - solo_vps_human_admin_authorized_key is match(solo_vps_ssh_public_key_regex)
    fail_msg: >-
      admin.human_ssh_public_key must contain exactly one supported public key
      copied from the normal operator workstation. The matching private key must
      remain on that workstation.
